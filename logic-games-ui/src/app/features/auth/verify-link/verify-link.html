<div class="verify-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Estado de Verificación</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      
      @if (isLoading) {
        <mat-spinner diameter="50"></mat-spinner>
        <p style="margin-top: 15px; font-weight: 500;">{{ statusMessage }}</p>
      } @else {
        <div [class]="isError ? 'error-banner' : 'success-banner'" style="width: 100%; box-sizing: border-box;">
          <mat-icon>{{ isError ? 'error_outline' : 'check_circle' }}</mat-icon>
          <span>{{ statusMessage }}</span>
        </div>
      }

    </mat-card-content>
    
    <!-- Ocultamos los botones si está cargando para que no haya acciones accidentales -->
    @if (!isLoading) {
      <mat-card-actions>
        @if (isError) {
          <a mat-button routerLink="/register">Volver a Registrarse</a>
        }
        <a mat-button routerLink="/login">Ir a Login</a>
      </mat-card-actions>
    }
  </mat-card>
</div>
