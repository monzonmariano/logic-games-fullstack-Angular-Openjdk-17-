# --- ¡ARCHIVOO LIMPIO! (Sin Secretos) ---

# 1. Conexión a la BBDD (Lee del docker-compose.yml)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# 2. Configuración de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# 3. Secretos (Leen del docker-compose.yml)
app.jwt.secret-key=${APP_JWT_SECRET_KEY}
# --- NUEVA CONFIGURACIÓN DE CORREO SMTP (Estándar) ---
spring.mail.host=smtp.resend.com
spring.mail.port=465
spring.mail.username=resend
spring.mail.password=${APP_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true